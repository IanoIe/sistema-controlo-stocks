<aside class="flex min-h-screen w-64 flex-col bg-violet-50 text-gray-700 border-r border-violet-100">

  <!-- Navigation -->
   <nav class="flex-1 space-y-3 overflow-y-auto px-3 py-3">

    <!-- MAIN MENU -->
    <div>
      <p class="mb-3 px-3 text-lg font-bold uppercase tracking-wider text-gray-700 text-center">
        Main Menu
      </p>

      <div class="space-y-0.5">

        <!-- Dashboard -->
        <a routerLink="/dashboard"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           [routerLinkActiveOptions]="{ exact: true }"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>🏠</span>
          <span>Dashboard</span>
        </a>

        <!-- Products -->
        <a routerLink="/products"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>📦</span>
          <span>Products</span>
        </a>

        <!-- Categories -->
        <a routerLink="/categories"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>🏷️</span>
          <span>Categories</span>
        </a>

      </div>
    </div>

    <!-- STOCK MANAGEMENT -->
    <div>
      <p class="mb-3 px-3 text-lg font-bold uppercase tracking-wider text-gray-700 text-center">
        Stock Management
      </p>

      <div class="space-y-0.5">

        <!-- Warehouses -->
        <a routerLink="/warehouses"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>🏭</span>
          <span>Warehouses</span>
        </a>

        <!-- Entries -->
        <a routerLink="/entries"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>📥</span>
          <span>Entries</span>
        </a>

        <!-- Exits -->
        <a routerLink="/exit"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>📤</span>
          <span>Exits</span>
        </a>

        <!-- Transfers -->
        <a routerLink="/transfers"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>🔄</span>
          <span>Transfers</span>
        </a>

        <!-- Stock Alerts -->
        <a routerLink="/alerts"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>⚠️</span>
          <span>Stock Alerts</span>
        </a>

      </div>
    </div>

    <!-- MANAGEMENT -->
    <div>
      <p class="mb-3 px-3 text-lg font-bold uppercase tracking-wider text-gray-700 text-center">
        Management
      </p>

      <div class="space-y-0.5">

        <!-- Suppliers -->
        <a routerLink="/suppliers"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>🚚</span>
          <span>Suppliers</span>
        </a>

        <!-- Users -->
        <a routerLink="/users"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>👥</span>
          <span>Users</span>
        </a>

        <!-- Stock History -->
        <a routerLink="/histories"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>📜</span>
          <span>Stock History</span>
        </a>

        <!-- Reports -->
        <a routerLink="/reports"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>📊</span>
          <span>Reports</span>
        </a>

        <!-- Audit Logs -->
        <a routerLink="/audit-logs"
           routerLinkActive="bg-violet-700 text-white shadow-sm"
           class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
          <span>🔎</span>
          <span>Audit Logs</span>
        </a>

      </div>
    </div>

  </nav>

  <!-- Profile -->
  <div class="border-t border-violet-200 p-3">

    <a routerLink="/profile"
       routerLinkActive="bg-violet-700 text-white shadow-sm"
       class="flex items-center gap-3 rounded-lg px-3 py-3 font-medium transition-colors hover:bg-violet-100 hover:text-violet-900">
      <span>👤</span>
      <span>Profile</span>
    </a>

  </div>

</aside>

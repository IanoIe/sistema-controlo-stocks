<div class="min-h-screen flex items-center justify-center bg-white">
  <div class="w-96">
    <form>
      <!-- Email -->
      <div class="mb-8">
        <label class="block text-xl mb-2">
          Email
        </label>

        <input type="email" class="w-full h-14 bg-cyan-800 border-2 border-gray-900 text-white px-4 outline-none">
      </div>

      <!-- Password -->
      <div class="mb-8">
        <label class="block text-xl mb-2">
          Password
        </label>

        <input type="password" value="**********" class="w-full h-14 bg-cyan-800 border-2 border-gray-900 text-white text-center px-4 outline-none">
      </div>

      <!-- Remember -->
      <div class="flex items-center gap-10 mb-16">

        <input type="checkbox" class="w-6 h-6 accent-cyan-800">

        <span class="text-xl">
          Lembrar sessão
        </span>
      </div>

      <!-- Button -->
      <div class="flex justify-center">

        <button type="submit" class="bg-cyan-800 text-white text-xl px-10 py-1 border-2 border-gray-900 hover:bg-cyan-900">
          Login
        </button>
      </div>
    </form>
  </div>
</div>

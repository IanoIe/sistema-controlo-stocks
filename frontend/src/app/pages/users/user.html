<div class="min-h-screen w-full flex bg-gray-50">

  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Content -->
  <main class="flex-1 p-6">

    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-800 text-center">
        Users
      </h1>
      <p class="text-sm text-gray-500 mt-1 text-center">
        List of all users.
      </p>
    </div>

    <!-- Loading -->
    @if (loading) {
      <div class="bg-white rounded-lg border border-gray-200 p-6">
        <p class="text-gray-500">
          Loading users...
        </p>
      </div>
    }


    <!-- Error -->
    @else if (error) {
      <div class="bg-red-50 border border-red-200 text-red-600 rounded-lg p-4">
        {{ error }}
      </div>
    }

    <!-- Users -->
    @else {
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <table class="w-full">
          <!-- Header -->
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase"> Name </th>
              <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase"> Email </th>
              <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase"> Role </th>
            </tr>
          </thead>

          <!-- Body -->
          <tbody class="divide-y divide-gray-200">
            @for (user of users; track user.id) {
              <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 text-sm font-medium text-gray-800"> {{ user.name }} </td>
                <td class="px-6 py-4 text-sm text-gray-600"> {{ user.email }} </td>
                <td class="px-6 py-4 text-sm text-gray-600"> {{ getRole(user) }} </td>
              </tr>
            }
          </tbody>
        </table>

        <!-- No users -->
        @if (users.length === 0) {
          <div class="p-6 text-center text-gray-500"> No users found. </div>
        }
      </div>
    }
  </main>
</div>

<div class="min-h-screen w-full flex bg-gray-50">

  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <main class="flex-1 p-5">
    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-800">
        New Product
      </h1>
      <p class="mt-1 text-gray-500">
        Create a new product
      </p>
    </div>

    <!-- Product Form -->
    <div class="max-w-4xl rounded-lg bg-white p-6 shadow-sm">
      <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
        <!-- Product Code -->
        <div>
          <label for="codeProduct" class="mb-2 block text-sm font-medium text-gray-700">
            Product Code
          </label>
          <input id="codeProduct" name="codeProduct" type="text" [(ngModel)]="product.codeProduct"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm
            outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="PRD001"/>
        </div>

        <!-- Product Name -->
        <div>
          <label
            for="nameProduct" class="mb-2 block text-sm font-medium text-gray-700">
              Product Name
          </label>

          <input id="nameProduct" name="nameProduct" type="text" [(ngModel)]="product.nameProduct"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            placeholder="Keyboard"/>
        </div>

        <!-- Category -->
        <div>
          <label for="category" class="mb-2 block text-sm font-medium text-gray-700">
            Category
          </label>

          <select id="category" name="category" [(ngModel)]="product.category" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm
               outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            <option value="">Select a category</option>
          </select>
        </div>

        <!-- Price -->
        <div>
          <label for="price" class="mb-2 block text-sm font-medium text-gray-700">
            Price
          </label>

          <input id="price" name="price" type="number" step="0.01" min="0" [(ngModel)]="product.price"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            placeholder="25.50" />
        </div>

        <!-- Quantity -->
        <div>
          <label for="quantity" class="mb-2 block text-sm font-medium text-gray-700">
            Quantity
          </label>

          <input id="quantity" name="quantity" type="number" min="0" [(ngModel)]="product.quantity"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="10"/>
        </div>

        <!-- Minimum Stock -->
        <div>
          <label for="stockMin" class="mb-2 block text-sm font-medium text-gray-700">
            Minimum Stock
          </label>

          <input id="stockMin" name="stockMin" type="number" min="0" [(ngModel)]="product.stockMin"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm
                   outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="5"/>
        </div>
      </div>

      <!-- Actions -->
      <div class="mt-6 flex justify-end gap-3">
        <button type="button" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
          Cancel
        </button>

        <button type="button" class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
          Create Product
        </button>
      </div>
    </div>
  </main>
</div>

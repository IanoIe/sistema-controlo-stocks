<div class="min-h-screen w-full flex bg-gray-50">

  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Dashboard Content -->
  <main class="flex-1 p-5">

    <!-- Header -->
    <div class="mb-5">
      <p class="text-gray-500 text-sm">Stock overview</p>
    </div>

    <div class="min-h-screen bg-gray-50 p-6">

      <div class="max-w-3xl mx-auto">

        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">

          <h1 class="text-2xl font-bold text-gray-800 mb-2">
            My Profile
          </h1>

          <p class="text-sm text-gray-500 mb-6">
            Manage your personal information.
          </p>

          @if (loading) {

            <div class="text-gray-500">
              Loading profile...
            </div>

          } @else if (user) {

            <div class="space-y-5">

              <!-- Name -->
              <div>
                <p class="text-sm text-gray-500">
                  Name
                </p>

                <p class="text-lg font-semibold text-gray-800">
                  {{ user.name }}
                </p>
              </div>

              <!-- Email -->
              <div>
                <p class="text-sm text-gray-500">
                  Email
                </p>

                <p class="text-lg font-semibold text-gray-800">
                  {{ user.email }}
                </p>
              </div>

              <!-- Password -->
              <div>
                <p class="text-sm text-gray-500">
                  Password
                </p>

                <p class="text-lg font-semibold text-gray-800 tracking-widest">
                  ••••••••••••
                </p>
              </div>

              <!-- Roles -->
              <div>
                <p class="text-sm text-gray-500">
                  Roles
                </p>

                <div class="flex gap-2 mt-1">
                  @for (role of user.roles; track role) {
                    <span
                      class="px-3 py-1 rounded-full bg-cyan-100 text-cyan-700 text-sm font-medium"
                    >
                      {{ role }}
                    </span>
                  }
                </div>
              </div>

            </div>

          } @else {

            <div class="text-red-500">
              Unable to load profile.
            </div>

          }

        </div>

      </div>

    </div>

  </main>

</div>

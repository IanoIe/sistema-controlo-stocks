<div class="min-h-screen w-full flex bg-gray-50">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <main class="flex-1 p-5">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Entries</h1>
        <p class="text-gray-500 mt-1">
          Stock entry management
        </p>
      </div>

      <button class="bg-cyan-700 text-white px-5 py-2.5 rounded-lg hover:bg-cyan-800 transition-colors">
        + New Entry
      </button>
    </div>

    <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-gray-100 border-b border-gray-200">
          <tr>
            <th class="px-6 py-4 font-semibold text-gray-700">Product</th>
            <th class="px-6 py-4 font-semibold text-gray-700">Quantity</th>
            <th class="px-6 py-4 font-semibold text-gray-700">Date</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let entry of stockEntries" class="border-b border-gray-200 hover:bg-gray-50">
            <td class="px-6 py-4"> {{ entry.product.nameProduct }} </td>
            <td class="px-6 py-4"> +{{ entry.quantity }}</td>
            <td class="px-6 py-4"> {{ entry.dateStockEntry | date:'dd/MM/yyyy HH:mm' }} </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

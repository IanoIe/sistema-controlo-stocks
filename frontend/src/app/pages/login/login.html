<div class="w-full min-h-full flex flex-col items-center justify-center px-4 py-8">

  <!-- Login Content -->
  <div class="w-full max-w-md">
    <!-- Títle -->
    <h2 class="text-3xl sm:text-4xl font-bold text-center text-gray-900 mb-8 sm:mb-10">
      Login
    </h2>

    <form (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="mb-6 sm:mb-7">
        <label class="block text-sm font-medium text-gray-600 mb-2">
          Email
        </label>

        <div class="flex items-center border-b-2 border-gray-200 focus-within:border-purple-500 transition-colors">
          <span class="text-gray-400 mr-3 flex-shrink-0">👤</span>
          <input type="text" name="username"
            [(ngModel)]="email" placeholder="Type your email"
            class="w-full py-2 text-sm sm:text-base text-gray-700 outline-none bg-transparent">
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-600 mb-2">
          Password
        </label>

        <div class="flex items-center border-b-2 border-gray-200 focus-within:border-purple-500 transition-colors">
          <span class="text-gray-400 mr-3 flex-shrink-0">🔒</span>
          <input type="password" name="password" [(ngModel)]="password"
            placeholder="Type your password"
            class="w-full py-2 text-sm sm:text-base text-gray-700 outline-none bg-transparent">
        </div>
      </div>

      <!-- Forgot password -->
      <div class="text-right mb-7 sm:mb-8">
        <a href="#" class="text-xs sm:text-sm text-gray-500 hover:text-purple-600 transition-colors">
          Forgot password?
        </a>
      </div>

      <!-- Login button -->
      <button type="submit"
        class="w-full py-3 rounded-full text-sm sm:text-base text-white font-medium
               bg-gradient-to-r from-cyan-400 via-purple-500 to-fuchsia-500
               hover:opacity-90 transition-opacity"> LOGIN
      </button>

    </form>

  </div>

</div>

<div class="w-full min-h-full flex flex-col items-center justify-center px-4 py-8">

  <div class="w-full max-w-md">

    <!-- Title -->
    <h2 class="text-3xl sm:text-4xl font-bold text-center text-gray-900 mb-8">
      Create Account
    </h2>

    <form (ngSubmit)="onSubmit()">

      <!-- Name -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-600 mb-2">
          Full Name
        </label>

        <div class="flex items-center border-b-2 border-gray-200 focus-within:border-purple-500 transition-colors">
          <span class="text-gray-400 mr-3">👤</span>

          <input
            type="text"
            name="name"
            [(ngModel)]="name"
            placeholder="Type your full name"
            required
            class="w-full py-2 text-sm sm:text-base text-gray-700 outline-none bg-transparent">
        </div>
      </div>

      <!-- Email -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-600 mb-2">
          Email
        </label>

        <div class="flex items-center border-b-2 border-gray-200 focus-within:border-purple-500 transition-colors">
          <span class="text-gray-400 mr-3">📧</span>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Type your email"
            required
            class="w-full py-2 text-sm sm:text-base text-gray-700 outline-none bg-transparent">
        </div>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-600 mb-2">
          Password
        </label>

        <div class="flex items-center border-b-2 border-gray-200 focus-within:border-purple-500 transition-colors">
          <span class="text-gray-400 mr-3">🔒</span>

          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Create a password"
            required
            class="w-full py-2 text-sm sm:text-base text-gray-700 outline-none bg-transparent">
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-600 mb-2">
          Confirm Password
        </label>

        <div class="flex items-center border-b-2 border-gray-200 focus-within:border-purple-500 transition-colors">
          <span class="text-gray-400 mr-3">🔒</span>

          <input
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm your password"
            required
            class="w-full py-2 text-sm sm:text-base text-gray-700 outline-none bg-transparent">
        </div>
      </div>

      <!-- Error -->
      @if (error) {
        <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm text-center">
          {{ error }}
        </div>
      }

      <!-- Success -->
      @if (success) {
        <div class="mb-4 px-4 py-3 rounded-lg bg-green-50 border border-green-200 text-green-600 text-sm text-center">
          {{ success }}
        </div>
      }

      <!-- Register Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3 rounded-full text-sm sm:text-base text-white font-medium
        bg-gradient-to-r from-cyan-400 via-purple-500 to-fuchsia-500
        hover:opacity-90 transition-opacity disabled:opacity-50">

        {{ loading ? 'CREATING ACCOUNT...' : 'CREATE ACCOUNT' }}

      </button>

    </form>

    <!-- Login Link -->
    <div class="mt-6 text-center">

      <p class="text-sm text-gray-500 mb-3">
        Already have an account?
      </p>

      <button
        type="button"
        (click)="goToLogin()"
        class="w-full py-3 rounded-full text-sm sm:text-base font-medium
        border-2 border-purple-500 text-purple-600
        hover:bg-purple-50 transition-colors">

        BACK TO LOGIN

      </button>

    </div>

  </div>
</div>
